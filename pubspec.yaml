name: Raven
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  share_plus: ^7.0.1
  # ИСПОЛЬЗУЕМ РАБОЧУЮ ВЕРСИЮ:
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_svg: ^2.2.1
  flutter_launcher_icons: "^0.13.1"

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0C0D16"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/BackgroundActivity.png
    - assets/Raven.png